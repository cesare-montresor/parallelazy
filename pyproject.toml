[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelazy"
version = "0.2.0"
description = "A lightweight multiprocess worker-plugin framework. Topic-based pub/sub, global environment, using process spawn and pipes, PyTorch and CUDA ready."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Cesare Montresor" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "torch",
    "numpy"
]

[project.optional-dependencies]
monitoring = [
    "psutil",
    "nvidia-ml-py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["parallelazy*"]


[project.urls]
Homepage = "https://github.com/cesare-montresor/parallelazy"
Repository = "https://github.com/cesare-montresor/parallelazy"
Issues = "https://github.com/cesare-montresor/parallelazy/issues"