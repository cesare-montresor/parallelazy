name: Publish Release

on:
  push:
    branches:
      - "release"

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required to check existing tags before building
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Forces 3.11 just for this runner so we can use the native tomllib parser
          python-version: "3.11"

      - name: Read version and check tag
        id: check_version
        run: |
          # Accurately targets project.version inside the TOML structure
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_NAME="v$VERSION"
          
          echo "version=$TAG_NAME" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists! Pipeline aborted to prevent duplicate publish."
            exit 1 
          fi

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.version }}
          name: Release ${{ steps.check_version.outputs.version }}
          generate_release_notes: true
          files: dist/* 

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
