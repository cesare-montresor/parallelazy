name: Find Missing PyPI Releases
description: Finds non-draft GitHub Releases newer than the latest version on PyPI, sorted in ascending PEP 440 order.

inputs:
  github-token:
    description: GitHub token with contents:read permission for querying releases.
    required: true

outputs:
  has_missing:
    description: "'true' if there are missing releases to publish, otherwise 'false'."
    value: ${{ steps.find_missing.outputs.has_missing }}
  releases:
    description: JSON array of release tag names to publish in ascending version order.
    value: ${{ steps.find_missing.outputs.releases }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install packaging
      shell: bash
      run: python -m pip install packaging

    - name: Find GitHub Releases newer than latest PyPI version
      id: find_missing
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python - <<'PY'
        import json
        import os
        import tomllib
        import urllib.error
        import urllib.request
        from packaging.version import InvalidVersion, Version

        with open("pyproject.toml", "rb") as f:
            package_name = tomllib.load(f)["project"]["name"]

        # 1. Fetch latest published version from PyPI
        pypi_url = f"https://pypi.org/pypi/{package_name}/json"
        pypi_req = urllib.request.Request(
            pypi_url,
            headers={
                "Accept": "application/json",
                "User-Agent": "parallelazy-sync-pypi",
            },
        )
        try:
            with urllib.request.urlopen(pypi_req, timeout=30) as resp:
                pypi_data = json.load(resp)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                pypi_data = None
            else:
                raise

        pypi_versions = []
        if pypi_data is not None:
            for ver_str, files in pypi_data.get("releases", {}).items():
                if not files:
                    continue
                try:
                    pypi_versions.append(Version(ver_str))
                except InvalidVersion:
                    continue

        latest_pypi = max(pypi_versions) if pypi_versions else None

        # 2. Fetch all GitHub Releases (paginated)
        repo = os.environ["GITHUB_REPOSITORY"]
        token = os.environ["GH_TOKEN"]
        releases = []
        page = 1
        while True:
            gh_url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
            gh_req = urllib.request.Request(
                gh_url,
                headers={
                    "Accept": "application/vnd.github+json",
                    "Authorization": f"Bearer {token}",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "parallelazy-sync-pypi",
                },
            )
            with urllib.request.urlopen(gh_req, timeout=30) as resp:
                batch = json.load(resp)
            if not batch:
                break
            releases.extend(batch)
            if len(batch) < 100:
                break
            page += 1

        # 3. Filter releases newer than latest_pypi with dist assets, sorted ascending
        missing = []
        for rel in releases:
            if rel.get("draft"):
                continue
            tag = rel.get("tag_name", "")
            ver_str = tag[1:] if tag.startswith(("v", "V")) else tag
            try:
                ver = Version(ver_str)
            except InvalidVersion:
                print(f"::warning::Skipping release with non-PEP440 tag: {tag}")
                continue

            if latest_pypi is not None and ver <= latest_pypi:
                continue

            dist_assets = [
                asset["name"]
                for asset in rel.get("assets", [])
                if asset.get("name", "").endswith((".whl", ".tar.gz"))
            ]
            if not dist_assets:
                print(f"::warning::Skipping release {tag}: no .whl or .tar.gz assets attached.")
                continue

            missing.append((ver, tag))

        missing.sort(key=lambda item: item[0])
        tags = [tag for _, tag in missing]

        print(f"Package: {package_name}")
        print(f"Latest PyPI version: {latest_pypi if latest_pypi is not None else '(none)'}")
        if tags:
            print(f"Releases to upload to PyPI (in order): {', '.join(tags)}")
        else:
            print("PyPI is already up to date with GitHub Releases.")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"has_missing={'true' if tags else 'false'}\n")
            out.write(f"releases={json.dumps(tags)}\n")
        PY
